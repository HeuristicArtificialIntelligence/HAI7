<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAI7 - Redirecting...</title>
  <script>
    // Preserve path and redirect to home route
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    window.location.replace('/#' + path + search + hash);
  </script>
</head>
<body style="background:#030712;color:#94a3b8;font-family:sans-serif;display:grid;place-items:center;height:100vh;margin:0;">
